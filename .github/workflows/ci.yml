name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Delegates to the fleet's shared security workflow: gitleaks over
  # full history, pip-audit against the resolved dependency set, semgrep,
  # and a CycloneDX SBOM retained as a build artifact. The steps live in
  # mini-app-polis/.github so the pinned tool versions and the gating
  # decisions are in one place; see that repo's README for the inputs.
  security:
    uses: mini-app-polis/.github/.github/workflows/security.yml@v2
    with:
      language: python
      package-manager: uv

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # CD-020. `uv sync` without --locked silently re-resolves when the
      # lockfile and pyproject.toml disagree, so a stale lock passes CI and
      # then fails the deploy, where `uv sync --locked` refuses the drift.
      # Checked here because this is where the failure is cheap to fix.
      - name: Verify the lockfile matches pyproject
        run: uv lock --check

      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      # TEST-012. mypy was never run here, so nothing said the repo had
      # never been typechecked.
      - run: uv run mypy src/
      - run: uv run pytest --cov=watcher_cog --cov-report=term-missing

  release:
    name: Release
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install semantic-release plugins
        run: |
          npm install --no-save \
            semantic-release \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # semantic-release tags the release commit it leaves at HEAD. No tag
      # there means the push carried nothing releasable, and nothing new
      # needs deploying.
      - name: Record the release tag
        id: released
        run: echo "tag=$(git tag --points-at HEAD --list 'v*' | head -n1)" >> "$GITHUB_OUTPUT"

  # The function is deployed here, as a job, rather than by a workflow's own
  # trigger: a release published with GITHUB_TOKEN starts no workflows, so
  # `on: release` would never fire and the Lambda would drift behind main.
  deploy:
    needs: release
    if: needs.release.outputs.tag != ''
    permissions:
      id-token: write
      contents: read
    uses: mini-app-polis/.github/.github/workflows/lambda-deploy.yml@v3
    with:
      ref: ${{ needs.release.outputs.tag }}
      # These three match module "watcher" in mini-app-polis/infra cogs.tf;
      # the deploy refuses a function whose architecture differs.
      handler: watcher_cog.handler.lambda_handler
      architecture: arm64
      python-version: "3.11"
      role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      region: ${{ vars.AWS_REGION }}
      function-name: ${{ vars.AWS_FUNCTION_NAME }}

  # Conformance is graded on each release, after that release is running.
  # Sequential with deploy, as in every Lambda cog: a release that did not
  # deploy is not graded as though it had. The evaluation runs after this
  # job ends, so what the job reports is whether the request landed —
  # never what was found.
  evaluate:
    needs: deploy
    uses: mini-app-polis/.github/.github/workflows/evaluate.yml@v3
    secrets:
      api-key: ${{ secrets.CI_VALIDATOR_API_KEY }}
