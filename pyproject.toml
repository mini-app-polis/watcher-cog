[project]
name = "watcher-cog"
dynamic = ["version"]
description = "Google Drive watcher worker that asks the API to run the cog that owns a folder."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "miniapppolis-common-utils>=6.6.0,<7",
    "sentry-sdk",
]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "ANN"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests/unit"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.hatch.version]
path = "src/watcher_cog/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/watcher_cog"]

[tool.coverage.report]
# TEST-019: CI fails below this floor. Raise it as coverage rises; lowering it is a reviewed edit.
fail_under = 94

[tool.uv]
# The uv every lock in the fleet is written with. setup-uv reads this in CI,
# and an older or newer local uv refuses to run instead of rewriting the
# lock's revision. Upgrading uv is a fleet sweep: bump this everywhere, then
# re-lock, in commits of their own.
required-version = "==0.13.0"
