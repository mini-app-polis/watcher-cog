# watcher-cog / evaluator.yaml
# Per-repo evaluation configuration — ecosystem-standards ADR-001, ADR-002

type: trigger-cog

traits:
  - logger-primitive
  # src/watcher_cog/logger.py is the logger wrapper implementation for this
  # service — CD-009 (shared logger requirement) cannot apply to itself.

exemptions:
  - rule: PRIN-005
    reason: "Three-layer observability is satisfied for this trigger-cog: Healthchecks liveness ping via HEALTHCHECKS_URL_WATCHER (src/watcher_cog/heartbeat.py, pinged after every tick that checked every folder), structured logging via common-python-utils (declared dependency), and Sentry error tracking (sentry-sdk initialized in src/watcher_cog/handler.py at cold start). PRIN-005's check_notes scope run history to pipelines via the '(for pipelines)' parenthetical. Watcher-cog is a trigger-cog, not a pipeline — its operational signal is the Healthchecks ping, the function's error alarm and Sentry, and every trigger that queued work is reported under the queue message id it became. Run history belongs to the downstream pipeline-cogs watcher-cog triggers."
  - rule: PY-013
    reason: "Watcher-cog has no processing inputs of its own to deduplicate. It lists Drive folders and asks the API for every file present on every tick (ADR-005); deduplication of those asks is the API's, in api-kaianolevine-com's services/dispatch_claims.py, where it is implemented and tested. The cog does not process file contents, and downstream pipeline-cogs handle idempotency for the work they do."
  - rule: TEST-002
    reason: "TEST-002 asks for a test exercising the cog's deduplication guard. The guard for watcher-cog's asks is in api-kaianolevine-com (services/dispatch_claims.py, tests/test_dispatch_claims.py). What this repository owns is covered by test_files_already_claimed_are_silent in tests/test_watcher.py: a deduplicated answer queues nothing and reports nothing. Tracked alongside PY-013 for consistency."
